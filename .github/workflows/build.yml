name: Build Android APK

# 触发方式：
#   1) 推送代码到 main/master 分支时自动构建
#   2) 在 Actions 页面点 "Run workflow" 手动触发
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    # 使用官方 buildozer 镜像：已预装 Android SDK/NDK 与 buildozer，无需联网下载大文件
    container:
      image: kivy/buildozer:latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备中文字体
        # 中文字体不进仓库（体积大），改由云端构建时下载；main.py 会把它注册为默认字体
        run: |
          mkdir -p assets
          curl -fsSL -o assets/font.ttf \
            "https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SimplifiedChinese/NotoSansSC-Regular.otf" || true
          if [ ! -s assets/font.ttf ]; then
            apt-get update -qq
            apt-get install -y -qq fonts-wqy-microhei
            cp /usr/share/fonts/truetype/wqy/wqy-microhei.ttc assets/font.ttf || true
          fi
          ls -la assets/

      - name: 构建 APK
        # CI 以 root 运行，buildozer 会询问 "Are you sure you want to continue [y/n]?"
        # 用 yes 管道自动应答 y，避免无终端时 EOFError 崩溃
        run: yes | buildozer android debug 2>&1

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: memo_flashcard-apk
          path: bin/*.apk
          if-no-files-found: error
